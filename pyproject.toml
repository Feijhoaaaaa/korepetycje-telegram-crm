[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "korepetycje-crm"
version = "2.0.0"
description = "Telegram CRM and Mini App for tutoring businesses"
requires-python = ">=3.12"
dependencies = [
  "aiogram==3.31.0",
  "alembic==1.20.0",
  "asyncpg==0.31.0",
  "fastapi==0.141.1",
  "openpyxl==3.1.5",
  "pydantic-settings==2.15.0",
  "SQLAlchemy[asyncio]==2.0.54",
  "tzdata==2026.4",
  "uvicorn==0.53.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "httpx>=0.28,<1",
  "ruff>=0.11,<1",
]
build = [
  "pyinstaller==6.22.3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
